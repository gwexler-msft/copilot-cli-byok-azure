map $http_authorization $byok_key {
    default "";
    "~*^Bearer (.+)$" $1;
}

log_format byok '$request_method $uri $status $request_time';

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout byok;
    error_log /dev/stderr crit;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /__INTELLIJ_API_PATH__/ {
        proxy_pass https://__APIM_PRIVATE_IP__;
        proxy_set_header Host __APIM_GATEWAY_HOST__;
        proxy_ssl_name __APIM_GATEWAY_HOST__;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header api-key $byok_key;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 50m;
    }

    location / {
        return 404;
    }
}