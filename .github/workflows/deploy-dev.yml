          function Get-DevCallerPreviewFingerprint {
            param($Template,$Parameters,[string]$Environment,[string]$SourceSha,[string]$ApimResourceId,$CallerContract)
            if($Environment -cnotin @('comm-dev','gov-dev','comm-pilot','gov-pilot') -or $SourceSha -cnotmatch '\A[0-9a-f]{40}\z' -or
              $Template -isnot [Collections.IDictionary] -or $Parameters.parameters -isnot [Collections.IDictionary] -or
              $ApimResourceId -inotmatch '\A/subscriptions/[0-9a-f-]{36}/resourceGroups/[^/]+/providers/Microsoft.ApiManagement/service/[^/]+\z' -or
              $CallerContract -isnot [Collections.IDictionary] -or $CallerContract.Count -eq 0){throw 'Invalid caller transition receipt.'}
            function ConvertTo-CallerFingerprintValue {
              param($Value)
              if($Value -is [Collections.IDictionary]){
                $result=[ordered]@{}
                foreach($key in @($Value.Keys|Sort-Object -CaseSensitive)){$result[$key]=ConvertTo-CallerFingerprintValue $Value[$key]}
                return $result
              }
              if($Value -is [array]){
                $items=[Collections.Generic.List[object]]::new()
                foreach($entry in $Value){$items.Add((ConvertTo-CallerFingerprintValue $entry))}
                return ,$items.ToArray()
              }
              $Value
            }
            $receipt=ConvertTo-CallerFingerprintValue @{version=1;environment=$Environment;source=$SourceSha;target=$ApimResourceId;
              template=$Template;parameters=$Parameters;callerContract=$CallerContract}
            $bytes=[Text.Encoding]::UTF8.GetBytes(($receipt|ConvertTo-Json -Depth 100 -Compress))
            try{[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()}
            finally{[Array]::Clear($bytes,0,$bytes.Length);$receipt=$null}
          }
          function New-DevCallerCandidate {
            param($Document,[ValidateSet('shared','coexistence')][string]$Rollout,[string]$PreviousKeyState)
            $candidate=$Document|ConvertTo-Json -Depth 100|ConvertFrom-Json -AsHashtable
            $trust=$candidate.parameters.callerAuthPreparation.value
            if($trust -isnot [Collections.IDictionary] -or $trust.enabled -isnot [bool] -or $trust.keyEnabled -ne $true -or
              $trust.entraEnabled -ne $true -or $trust.oktaTrust.enabled -ne $false -or
              $candidate.parameters.callerAuthRollout.value -cnotin @('legacy','shared','coexistence') -or
              [string]::IsNullOrWhiteSpace($PreviousKeyState)){throw 'Invalid caller transition candidate.'}
            foreach($entry in @(@{name='responseOwnerKey';reference='${BYOK_RESPONSE_OWNER_KEY}'},@{name='responseOwnerPreviousKey';reference='${BYOK_RESPONSE_OWNER_PREVIOUS_KEY}'})){
              if($candidate.parameters.Contains($entry.name) -and $candidate.parameters[$entry.name].value -cne $entry.reference -and
                -not ($entry.name -ceq 'responseOwnerPreviousKey' -and $candidate.parameters[$entry.name].value -ceq '')){throw 'Invalid caller transition candidate.'}
            }
            $trust.enabled=$true
            $candidate.parameters.callerAuthRollout.value=$Rollout
            $candidate.parameters.responseOwnerKey=@{value='${BYOK_RESPONSE_OWNER_KEY}'}
            $candidate.parameters.responseOwnerPreviousKey=@{value=$(if($PreviousKeyState -ceq '__none__'){''}else{'${BYOK_RESPONSE_OWNER_PREVIOUS_KEY}'})}
            $candidate
          }
          function Resolve-DevCallerArtifactSource {
            param([ValidateSet('activate','rollback','finalize')][string]$Action,[string]$WorkflowSha,[string]$ExistingHold,[scriptblock]$VerifySource)
            if($WorkflowSha -cnotmatch '\A[0-9a-f]{40}\z'){throw 'Invalid caller transition receipt.'}
            if($Action -cne 'finalize'){return $WorkflowSha}
            if($ExistingHold -cnotmatch '\Av1:([0-9a-f]{40}):(?:shared|coexistence):[0-9a-f]{64}\z'){
              throw 'Caller transition hold requires reconciliation.'
            }
            $artifactSha=$Matches[1]
            if($artifactSha -cne $WorkflowSha){
              if($null -eq $VerifySource){throw 'Caller artifact source changed.'}
              $verified=& $VerifySource $artifactSha $WorkflowSha
              if($verified -isnot [bool] -or -not $verified){throw 'Caller artifact source changed.'}
            }
            $artifactSha
          }
          function New-DevCallerTransitionPlan {
            param([ValidateSet('activate','rollback','finalize')][string]$Action,[ValidateSet('shared','coexistence')][string]$Rollout,
              [bool]$PreviewOnly,[string]$Fingerprint,[string]$ReviewedFingerprint,[string]$SourceSha,[string]$SourceRef,
              [string]$GitHubEvent,[int]$RunAttempt,[string]$ExistingHold)
            if($Fingerprint -cnotmatch '\A[0-9a-f]{64}\z' -or $SourceSha -cnotmatch '\A[0-9a-f]{40}\z' -or
              ($Action -ceq 'activate' -and $Rollout -cne 'coexistence') -or ($Action -ceq 'rollback' -and $Rollout -cne 'shared')){
              throw 'Invalid caller transition receipt.'
            }
            $hold='v1:'+$SourceSha+':'+$Rollout+':'+$Fingerprint
            if($ExistingHold -and $ExistingHold -cnotmatch '\Av1:[0-9a-f]{40}:(?:shared|coexistence):[0-9a-f]{64}\z'){
              throw 'Caller transition hold requires reconciliation.'
            }
            if(($Action -ceq 'finalize' -and $ExistingHold -cne $hold) -or
              ($Action -ceq 'activate' -and $ExistingHold -and $ExistingHold -cne $hold)){
              throw 'Caller transition hold requires reconciliation.'
            }
            if(-not $PreviewOnly -and ($ReviewedFingerprint -cne $Fingerprint -or $SourceRef -cne 'refs/heads/main' -or
              $GitHubEvent -cne 'workflow_dispatch' -or $RunAttempt -ne 1)){throw 'Caller transition requires a reviewed main-branch preview.'}
            $steps=switch($Action){
              'activate' {@('set-hold','apply-coexistence','verify-coexistence')}
              'rollback' {@('set-hold','close-jwt-guard','detach-jwt-link','verify-link-absent','apply-shared','verify-shared')}
              'finalize' {
                if($PreviewOnly){@(('verify-'+$Rollout))}else{@('verify-persisted-settings',('verify-'+$Rollout),'clear-hold')}
              }
            }
            @{action=$Action;rollout=$Rollout;previewOnly=$PreviewOnly;hold=$hold;steps=@($steps)}
          }
          function Invoke-DevCallerTransitionPlan {
            param($Plan,[scriptblock]$Execute)
            if($Plan.previewOnly){
              if($Plan.action -cne 'finalize'){return}
              if($Plan.steps.Count -ne 1 -or $Plan.steps[0] -cne ('verify-'+$Plan.rollout)){
                throw 'Invalid caller readback preview plan.'
              }
            }
            foreach($step in $Plan.steps){& $Execute $step}
          }
          function ConvertTo-DevRawPolicyXml {
            param([string]$Text,[string]$Marker)
            if($Text.Length -gt 524288 -or $Text.Contains($Marker)){throw 'Invalid raw policy comparison input.'}
            Add-Type -AssemblyName Microsoft.CodeAnalysis.CSharp
            $options=[Microsoft.CodeAnalysis.CSharp.CSharpParseOptions]::Default
            $entities=[regex]::new('&(?:quot|apos|amp|lt|gt|#[0-9]+|#x[0-9a-fA-F]+);')
            $expressions=[regex]::new('<!--[\s\S]*?-->|@[({]')
            $result=[Text.StringBuilder]::new()
            $offset=0
            while($offset -lt $Text.Length){
              $match=$expressions.Match($Text,$offset)
              if(-not $match.Success){[void]$result.Append($Text.Substring($offset));break}
              [void]$result.Append($Text.Substring($offset,$match.Index-$offset))
              if($match.Value.StartsWith('<!--',[StringComparison]::Ordinal)){
                [void]$result.Append($match.Value)
                $offset=$match.Index+$match.Length
                continue
              }
              $tail=$Text.Substring($match.Index+1)
              $decoded=$entities.Replace($tail,[Text.RegularExpressions.MatchEvaluator]{param($entity) [Net.WebUtility]::HtmlDecode($entity.Value)})
              $opening=if($match.Value -ceq '@('){[Microsoft.CodeAnalysis.CSharp.SyntaxKind]::OpenParenToken}else{[Microsoft.CodeAnalysis.CSharp.SyntaxKind]::OpenBraceToken}
              $closing=if($match.Value -ceq '@('){[Microsoft.CodeAnalysis.CSharp.SyntaxKind]::CloseParenToken}else{[Microsoft.CodeAnalysis.CSharp.SyntaxKind]::CloseBraceToken}
              $depth=0;$expressionLength=0
              foreach($lexicalToken in [Microsoft.CodeAnalysis.CSharp.SyntaxFactory]::ParseTokens($decoded,0,0,$options)){
                if($lexicalToken.RawKind -eq [int]$opening){$depth++}
                if($lexicalToken.RawKind -eq [int]$closing){
                  $depth--
                  if($depth -eq 0){$expressionLength=$lexicalToken.Span.End;break}
                }
              }
              if($expressionLength -eq 0){throw 'Invalid raw policy expression.'}
              $expression=$decoded.Substring(0,$expressionLength)
              $syntax=if($match.Value -ceq '@('){
                [Microsoft.CodeAnalysis.CSharp.SyntaxFactory]::ParseExpression($expression,0,$options,$true)
              }else{
                [Microsoft.CodeAnalysis.CSharp.SyntaxFactory]::ParseStatement($expression,0,$options,$true)
              }
              if($null -eq $syntax -or $syntax.ContainsDiagnostics -or $syntax.ContainsDirectives -or $syntax.Span.Start -ne 0 -or
                ($match.Value -ceq '@(' -and $syntax -isnot [Microsoft.CodeAnalysis.CSharp.Syntax.ParenthesizedExpressionSyntax]) -or
                ($match.Value -ceq '@{' -and $syntax -isnot [Microsoft.CodeAnalysis.CSharp.Syntax.BlockSyntax])){throw 'Invalid raw policy expression.'}
              $entityMap=@($entities.Matches($tail)|ForEach-Object {@{index=$_.Index;length=$_.Length;decodedLength=([Net.WebUtility]::HtmlDecode($_.Value)).Length}})
              function Get-DevRawSourceOffset {
                param([int]$DecodedOffset)
                $sourceOffset=$DecodedOffset
                foreach($entity in $entityMap){
                  if($entity.index -ge $sourceOffset){break}
                  $sourceOffset+=$entity.length-$entity.decodedLength
                }
                $sourceOffset
              }
              $sourceLength=Get-DevRawSourceOffset $syntax.Span.End
              $tokens=@(foreach($token in $syntax.DescendantTokens()){
                if($token.IsMissing){throw 'Invalid raw policy token.'}
                $start=Get-DevRawSourceOffset $token.Span.Start
                $end=Get-DevRawSourceOffset $token.Span.End
                $lexeme=$tail.Substring($start,$end-$start)
                if($entities.Replace($lexeme,[Text.RegularExpressions.MatchEvaluator]{param($entity) [Net.WebUtility]::HtmlDecode($entity.Value)}) -cne $token.Text){throw 'Ambiguous raw policy token.'}
                [ordered]@{kind=$token.RawKind;text=$lexeme}
              })
              $bytes=[Text.Encoding]::UTF8.GetBytes((ConvertTo-Json -InputObject $tokens -Depth 5 -Compress))
              $digest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
              [void]$result.Append($Marker+$digest)
              $offset=$match.Index+1+$sourceLength
            }
            $result.ToString()
          }
          function Test-DevCallerProperties {
            param($Expected,$Actual,[string]$Path='properties',[bool]$RawPolicy=$false)
            if($Expected -is [Collections.IDictionary]){
              if($Actual -isnot [Collections.IDictionary]){return $false}
              $rawContent=$RawPolicy -or ($Path -ceq 'properties' -and $Expected.format -ceq 'rawxml')
              foreach($key in $Expected.Keys){
                if(-not (Test-DevCallerProperties $Expected[$key] $Actual[$key] ($Path+'.'+$key) $rawContent)){return $false}
              }
              return $true
            }
            if($Expected -is [array]){
              if($Actual -isnot [array] -or $Expected.Count -ne $Actual.Count){return $false}
              for($index=0;$index -lt $Expected.Count;$index++){
                if(-not (Test-DevCallerProperties $Expected[$index] $Actual[$index] ($Path+'[]'))){return $false}
              }
              return $true
            }
            if($Expected -is [string] -and $Actual -is [string]){
              if($Path -ceq 'properties.format' -and $Expected -cin @('xml','rawxml')){return $Actual -cin @('xml','rawxml')}
              if($Path -ceq 'properties.value' -and $Expected.TrimStart().StartsWith('<')){
                try{
                  $documents=@()
                  $marker='byokReadback'+[guid]::NewGuid().ToString('N')
                  foreach($text in @($Expected,$Actual)){
                    $content=$text.Replace("`r`n","`n")
                    if($RawPolicy){$content=ConvertTo-DevRawPolicyXml $content $marker}
                    $settings=[Xml.XmlReaderSettings]::new();$settings.DtdProcessing=[Xml.DtdProcessing]::Prohibit;$settings.XmlResolver=$null
                    $reader=[Xml.XmlReader]::Create([IO.StringReader]::new($content),$settings)
                    try{$xml=[Xml.XmlDocument]::new();$xml.XmlResolver=$null;$xml.Load($reader);$documents+=,$xml.OuterXml}finally{$reader.Dispose()}
                  }
                  return $documents[0] -ceq $documents[1]
                }catch{return $false}
              }
              return $Expected -ceq $Actual
            }
            [Newtonsoft.Json.Linq.JToken]::DeepEquals(
              [Newtonsoft.Json.Linq.JToken]::Parse((ConvertTo-Json -InputObject $Expected -Depth 100 -Compress)),
              [Newtonsoft.Json.Linq.JToken]::Parse((ConvertTo-Json -InputObject $Actual -Depth 100 -Compress)))
          }
          function Assert-DevCallerReadback {
            param($Preview,[string]$ApimId,[string[]]$Paths,$Parameters,[scriptblock]$Read)
            foreach($path in $Paths){
              $resourceId=$ApimId+'/'+$path
              $change=@($Preview.changes|Where-Object {$_.resourceId -ieq $resourceId -and $_.changeType -cin @('Create','Modify','NoChange')})
              if($change.Count -ne 1){throw 'Caller resource readback failed.'}
              if($path -cmatch '\Aproducts/[A-Za-z0-9_-]+/apis/copilot-byok-foundry\z'){
                $association=& $Read ('/'+$path) 'HEAD'
                if($association.status -ne 204){throw 'Caller product association readback failed.'}
                continue
              }
              $expected=($change[0].after ?? $change[0].before).properties
              if($expected -isnot [Collections.IDictionary]){throw 'Caller resource readback failed.'}
              $expected=$expected|ConvertTo-Json -Depth 100|ConvertFrom-Json -AsHashtable
              $format=if($path -cmatch '\ApolicyFragments/[A-Za-z0-9_-]+\z|/policies/policy\z' -and $expected.format -cin @('xml','rawxml')){$expected.format}else{''}
              $actual=& $Read ('/'+$path) 'GET' $format
              if($actual.id -ine $resourceId -or $actual.properties -isnot [Collections.IDictionary]){throw 'Caller resource readback failed.'}
              $actualProperties=$actual.properties|ConvertTo-Json -Depth 100|ConvertFrom-Json -AsHashtable
              if($path -cmatch '\ApolicyFragments/[A-Za-z0-9_-]+\z' -and -not $actualProperties.Contains('format')){
                $actualProperties.format='xml'
              }
              if($path -ceq 'apis/copilot-byok-foundry' -and $expected.Contains('apiType')){
                if($expected.apiType -cnotin @('http','*******')){throw 'Caller resource readback failed.'}
                foreach($typeField in @('apiType','type')){
                  if($actualProperties.Contains($typeField) -and $actualProperties[$typeField] -cne 'http'){throw 'Caller resource readback failed.'}
                }
                [void]$expected.Remove('apiType')
              }
              if($path -cin @('namedValues/caller-response-owner-key','namedValues/caller-response-owner-key-previous')){
                [void]$expected.Remove('value')
                if($actual.properties.secret -ne $true -or $actual.properties.keyVault){throw 'Caller resource readback failed.'}
                $secret=& $Read ('/'+$path+'/listValue') 'POST'
                $key=if($path -ceq 'namedValues/caller-response-owner-key'){$Parameters.parameters.responseOwnerKey.value}else{$Parameters.parameters.responseOwnerPreviousKey.value}
                if($key -ceq ''){$key='__none__'}
                if($secret.value -cne $key){throw 'Caller ownership key mismatch.'}
                $secret=$null;$key=$null
              }
              if(-not (Test-DevCallerProperties $expected $actualProperties)){throw 'Caller resource readback failed.'}
            }
          }
          function Assert-DevCallerTieringParameters {
            param([Collections.IDictionary]$Parameters)
            if(-not $Parameters.Contains('callerJwtTiering')){return}
            $params=$Parameters|ConvertTo-Json -Depth 100|ConvertFrom-Json
            $StandaloneCloud=''
            $parseErrors=$null
            $guard=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/check-provision-params.ps1'),[ref]$null,[ref]$parseErrors)
            if($parseErrors.Count){throw 'Invalid JWT tier configuration.'}
            foreach($name in @('Resolve-ParamValue','Resolve-PreparationValue','Test-PreparationProperties','Test-PreparationString','Test-CallerAuthPreparation','Test-CallerJwtTiering')){
              $definition=@($guard.FindAll({param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq $name},$false))
              if($definition.Count -ne 1){throw 'Invalid JWT tier configuration.'}
              . ([scriptblock]::Create($definition[0].Extent.Text))
            }
            try{$valid=Test-CallerJwtTiering}catch{$valid=$false}
            if(-not $valid){throw 'Invalid JWT tier configuration.'}
          }
          function New-DevApimPreviewParameters {
