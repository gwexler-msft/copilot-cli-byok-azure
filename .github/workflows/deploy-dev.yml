              $productId=$focusedParameters.parameters.jwtProductId.value
              $paths=@(Get-DevApimPreviewPaths $productId ($callerRollout -ceq 'coexistence'))
              $focusedFile=Join-Path $env:RUNNER_TEMP ('byok-caller-'+[guid]::NewGuid().ToString('N')+'.json')
              $null=Invoke-DevPreviewProcess bicep @('build','infra/modules/apim-foundry-caller-rollout.bicep','--outfile',$focusedFile)
              $focusedTemplate=Get-Content -LiteralPath $focusedFile -Raw|ConvertFrom-Json -AsHashtable -Depth 100
              if($focusedTemplate.resources.consumer.properties.template.resources.api.properties.apiType -cne 'http'){
                throw 'Invalid APIM preview target.'
              }
              if($manualCaller){
                $callerContract=@{}
                foreach($name in @('cloudEnv','apiAudience','requiredScope','jwtDefaultCallsPerMinute','jwtDefaultTokensPerMinute','jwtDefaultMonthlyCallQuota')){
                  $callerContract[$name]=$parameters.parameters[$name].value
                }
                $fingerprint=Get-DevCallerPreviewFingerprint $focusedTemplate $focusedParameters $env:PREVIEW_ENVIRONMENT $artifactSourceSha $serviceId $callerContract
                $transition=New-DevCallerTransitionPlan $callerAction $callerRollout $previewOnly $fingerprint $env:CALLER_PREVIEW_DIGEST `
                  $artifactSourceSha $env:GITHUB_REF $env:GITHUB_EVENT_NAME ([int]$env:GITHUB_RUN_ATTEMPT) $existingHold
                $productInventory=Read-DevApimInventory '/products'
                if($productInventory.nextLink -or $productInventory.value -isnot [array]){throw 'Incomplete live APIM inventory.'}
                $jwtProducts=@($productInventory.value|Where-Object name -CEQ $productId)
                if($jwtProducts.Count -gt 1 -or ($jwtProducts.Count -and -not $allowPrepared)){throw 'Unrecognized prepared caller resources.'}
                $guardTemplate=$focusedTemplate.resources.admission.properties.template.variables.jwtProductGuardTemplate
                if([string]::IsNullOrWhiteSpace($guardTemplate)){throw 'Caller product guard template is missing.'}
                $closedGuard=@{format='xml';value=$guardTemplate.Replace('__ACTIVE__','false')}
                $activeGuard=@{format='xml';value=$guardTemplate.Replace('__ACTIVE__','true')}
                $linked=$false
                if($jwtProducts.Count){
                  if($jwtProducts[0].properties.subscriptionRequired -ne $false -or $jwtProducts[0].properties.state -cne 'notPublished'){
                    throw 'Unrecognized prepared caller resources.'
                  }
                  $guard=Read-DevApimPreviewResource ('/products/'+$productId+'/policies/policy')
                  if(-not (Test-DevCallerProperties $closedGuard $guard.properties) -and -not (Test-DevCallerProperties $activeGuard $guard.properties)){
                    throw 'Unrecognized prepared caller resources.'
                  }
                  $links=Read-DevApimInventory ('/products/'+$productId+'/apis')
                  if($links.nextLink -or $links.value -isnot [array] -or $links.value.Count -gt 1 -or
                    @($links.value|Where-Object name -CNE 'copilot-byok-foundry').Count){throw 'Unrecognized prepared caller resources.'}
                  $linked=$links.value.Count -eq 1
                }
                $keyNames=@('caller-response-owner-key','caller-response-owner-key-previous')
                $existingKeys=@($namedValues.value|Where-Object name -cin $keyNames)
                if($allowPrepared -and -not $existingHold -and $existingKeys.Count -ne 2){throw 'Caller ownership keys are incomplete.'}
                foreach($setting in $existingKeys){
                  if($setting.properties.secret -ne $true -or $setting.properties.keyVault){throw 'Caller ownership key mismatch.'}
                  $keyValue=Read-DevApimPreviewResource ('/namedValues/'+$setting.name+'/listValue') 'POST'
                  $expectedKey=if($setting.name -ceq 'caller-response-owner-key'){$focusedParameters.parameters.responseOwnerKey.value}else{$focusedParameters.parameters.responseOwnerPreviousKey.value}
                  if($expectedKey -ceq ''){$expectedKey='__none__'}
                  if($keyValue.value -cne $expectedKey){throw 'Caller ownership key mismatch.'}
                  $keyValue=$null;$expectedKey=$null
                }
              }
              $arguments=@('deployment','group','what-if','--subscription',$env:AZURE_SUBSCRIPTION_ID,'--resource-group',$groupName,
                '--template-file',$focusedFile,'--parameters','@/dev/stdin','--result-format','FullResourcePayloads',
                '--no-pretty-print','--only-show-errors','--output','json')
              $output=Invoke-DevPreviewProcess az $arguments ($focusedParameters|ConvertTo-Json -Depth 100 -Compress)
              $summary=Get-DevPreviewSummary $output $env:PREVIEW_ENVIRONMENT $env:AZURE_SUBSCRIPTION_ID $serviceId $paths ($callerRollout -ceq 'shared')
              $summary.previewScope='apim-only'
              if($manualCaller){
                $summary.callerPreviewDigest=$fingerprint
                $summary.callerAction=$callerAction
                $summary.callerArtifactSource=$artifactSourceSha
                $summary.callerVerifierSource=$env:GITHUB_SHA
                $summary.explicitJwtLinkRemoval=$callerAction -ceq 'rollback' -and $linked
                if(-not $summary.passed){$summary.applied=$false;$summary|ConvertTo-Json -Depth 6 -Compress;exit 1}
                $desiredPreview=$output|ConvertFrom-Json -AsHashtable -Depth 100
                if(-not $previewOnly -or $callerAction -ceq 'finalize'){
                  $armToken=Invoke-DevPreviewProcess az @('account','get-access-token','--subscription',$env:AZURE_SUBSCRIPTION_ID,'--resource-type','arm','--output','json')|ConvertFrom-Json
                  $handler=[Net.Http.HttpClientHandler]::new();$handler.AllowAutoRedirect=$false
                  $callerClient=[Net.Http.HttpClient]::new($handler)
                  $callerClient.DefaultRequestHeaders.Authorization=[Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer',$armToken.accessToken)
                  $callerClient.DefaultRequestHeaders.Accept.ParseAdd('application/json');$armToken=$null
                  function Invoke-DevCallerArm {
                    param([string]$Method,[string]$Path,$Body=$null,[string]$ETag='',[int[]]$AllowedStatus=@(200))
                    $request=[Net.Http.HttpRequestMessage]::new([Net.Http.HttpMethod]::new($Method),$armBase+$serviceId+$Path+'?api-version=2024-05-01')
                    try{
                      if($ETag){$null=$request.Headers.TryAddWithoutValidation('If-Match',$ETag)}
                      if($null -ne $Body){$request.Content=[Net.Http.StringContent]::new(($Body|ConvertTo-Json -Depth 100 -Compress),[Text.Encoding]::UTF8,'application/json')}
                      $response=$callerClient.SendAsync($request).GetAwaiter().GetResult()
                      try{
                        if([int]$response.StatusCode -notin $AllowedStatus){throw 'Caller control-plane request failed.'}
                        $text=$response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
                        $bodyValue=if([string]::IsNullOrWhiteSpace($text)){$null}else{$text|ConvertFrom-Json -AsHashtable -Depth 100}
                        @{status=[int]$response.StatusCode;body=$bodyValue;etag=[string]$response.Headers.ETag}
                      }finally{$response.Dispose()}
                    }finally{$request.Dispose()}
                  }
                  Invoke-DevCallerTransitionPlan $transition {
                    param($step)
                    switch($step){
                      'set-hold' {
                        $current=Invoke-DevPreviewProcess az @('group','show','--name',$groupName,'--subscription',$env:AZURE_SUBSCRIPTION_ID,'--output','json')|ConvertFrom-Json
                        if([string]$current.tags.byokCallerTransition -cne $existingHold){throw 'Caller transition hold requires reconciliation.'}
                        $null=Invoke-DevPreviewProcess az @('tag','update','--resource-id',$groupId,'--operation','Merge','--tags',('byokCallerTransition='+$transition.hold),'--subscription',$env:AZURE_SUBSCRIPTION_ID,'--output','none')
                        $current=Invoke-DevPreviewProcess az @('group','show','--name',$groupName,'--subscription',$env:AZURE_SUBSCRIPTION_ID,'--output','json')|ConvertFrom-Json
                        if($current.tags.byokCallerTransition -cne $transition.hold){throw 'Caller transition hold requires reconciliation.'}
                      }
                      'close-jwt-guard' {
                        if($jwtProducts.Count){
                          $path='/products/'+$productId+'/policies/policy'
                          $current=Invoke-DevCallerArm 'GET' $path
                          if([string]::IsNullOrWhiteSpace($current.etag) -or
                            (-not (Test-DevCallerProperties $closedGuard $current.body.properties) -and -not (Test-DevCallerProperties $activeGuard $current.body.properties))){throw 'Caller product guard changed.'}
                          $null=Invoke-DevCallerArm 'PUT' $path @{properties=$closedGuard} $current.etag @(200)
                          $current=Invoke-DevCallerArm 'GET' $path
                          if(-not (Test-DevCallerProperties $closedGuard $current.body.properties)){throw 'Caller product guard did not close.'}
                        }
                      }
                      'detach-jwt-link' {
                        if($jwtProducts.Count){$null=Invoke-DevCallerArm 'DELETE' ('/products/'+$productId+'/apis/copilot-byok-foundry') $null '' @(200,204)}
                      }
                      'verify-link-absent' {
                        $association=Invoke-DevCallerArm 'HEAD' ('/products/'+$productId+'/apis/copilot-byok-foundry') $null '' @(204,404)
                        $apiProducts=Read-DevApimInventory '/apis/copilot-byok-foundry/products'
                        if($association.status -ne 404 -or $apiProducts.nextLink -or $apiProducts.value -isnot [array] -or
                          $apiProducts.value.Count -ne 2 -or @($apiProducts.value|Where-Object {$_.name -cnotin @('byok-standard','byok-power') -or $_.properties.subscriptionRequired -ne $true}).Count){throw 'Caller JWT association is still present.'}
                      }
                      {$_ -cin @('apply-coexistence','apply-shared')} {
                        $result=Invoke-DevPreviewProcess az @('deployment','group','create','--subscription',$env:AZURE_SUBSCRIPTION_ID,'--resource-group',$groupName,
                          '--name',('byok-caller-'+$env:GITHUB_SHA.Substring(0,12)+'-'+$callerRollout),'--template-file',$focusedFile,'--parameters','@/dev/stdin',
                          '--only-show-errors','--output','json') ($focusedParameters|ConvertTo-Json -Depth 100 -Compress)|ConvertFrom-Json
                        if($result.properties.provisioningState -cne 'Succeeded'){throw 'Caller deployment did not succeed.'}
                      }
                      {$_ -cin @('verify-coexistence','verify-shared')} {
                        Assert-DevCallerReadback $desiredPreview $serviceId $paths $focusedParameters {
                          param($path,$method,$format)
                          if($method -ceq 'HEAD'){Invoke-DevCallerArm 'HEAD' $path $null '' @(204,404)}else{Read-DevApimPreviewResource $path $method $format}
                        }
                        $apiProducts=Read-DevApimInventory '/apis/copilot-byok-foundry/products'
                        $jwtLinks=@($apiProducts.value|Where-Object name -CEQ $productId)
                        $expectedCount=if($callerRollout -ceq 'coexistence'){3}else{2}
                        if($apiProducts.nextLink -or $apiProducts.value -isnot [array] -or $apiProducts.value.Count -ne $expectedCount -or
                          $jwtLinks.Count -ne $(if($callerRollout -ceq 'coexistence'){1}else{0})){throw 'Caller product association readback failed.'}
                      }
                      'verify-persisted-settings' {
                        if($storedPreparation -ne $true -or $storedRollout -cne $callerRollout){throw 'Persist matching caller settings before finalizing.'}
                      }
                      'clear-hold' {
                        $current=Invoke-DevPreviewProcess az @('group','show','--name',$groupName,'--subscription',$env:AZURE_SUBSCRIPTION_ID,'--output','json')|ConvertFrom-Json
                        if($current.tags.byokCallerTransition -cne $transition.hold){throw 'Caller transition hold requires reconciliation.'}
                        $null=Invoke-DevPreviewProcess az @('tag','update','--resource-id',$groupId,'--operation','Delete','--tags',('byokCallerTransition='+$transition.hold),'--subscription',$env:AZURE_SUBSCRIPTION_ID,'--output','none')
                        $current=Invoke-DevPreviewProcess az @('group','show','--name',$groupName,'--subscription',$env:AZURE_SUBSCRIPTION_ID,'--output','json')|ConvertFrom-Json
                        if($current.tags.byokCallerTransition){throw 'Caller transition hold did not clear.'}
                      }
                      default {throw 'Unknown caller transition step.'}
                    }
                  }
                }
                $summary.applied=-not $previewOnly -and $callerAction -cne 'finalize'
                $summary.finalized=-not $previewOnly -and $callerAction -ceq 'finalize'
                $summary.readbackVerified=-not $previewOnly -or $callerAction -ceq 'finalize'
                $summary.holdRetained=if($previewOnly){-not [string]::IsNullOrWhiteSpace($existingHold)}else{$callerAction -cne 'finalize'}
              }
            }else{
              $null=Invoke-DevPreviewProcess azd @('provision','--preview','--no-prompt','--output','json')
              $arguments=@('deployment','sub','what-if','--subscription',$env:AZURE_SUBSCRIPTION_ID,'--location',$env:AZURE_LOCATION,
                '--template-file','infra/main.bicep','--parameters','@/dev/stdin','--result-format','FullResourcePayloads','--no-pretty-print','--only-show-errors','--output','json')
              $output=Invoke-DevPreviewProcess az $arguments ($parameters|ConvertTo-Json -Depth 100 -Compress)
              $summary=Get-DevPreviewSummary -Output $output -Environment $env:PREVIEW_ENVIRONMENT -SubscriptionId $env:AZURE_SUBSCRIPTION_ID
              $summary.previewScope='full-stack'
            }
            $summary.callerRollout=$callerRollout
            if(-not $manualCaller){$summary.applied=$false}
            $summary|ConvertTo-Json -Depth 6 -Compress
            if(-not $summary.passed){exit 1}
          }catch{
            $category=switch -Exact ($_.Exception.Message){
              'Invalid preview context.' {'invalid-context'}
              'Incomplete ARM preview.' {'incomplete-inventory'}
              'Invalid ARM resource change.' {'invalid-resource'}
              'Preview changes another scope.' {'unexpected-scope'}
              'Preview changes an unapproved APIM resource.' {'unexpected-apim-resource'}
              'Preview changes native subscription admission.' {'native-admission-change'}
              'Invalid APIM preview target.' {'invalid-apim-target'}
              'Incomplete live APIM inventory.' {'incomplete-apim-inventory'}
              'Live APIM trust or routing differs from the candidate.' {'apim-trust-routing-mismatch'}
              'Gateway is not the verified native-key-only baseline.' {'not-native-baseline'}
              'Live APIM operation coverage differs.' {'apim-operation-mismatch'}
              'Invalid preview parameters.' {'invalid-parameters'}
              'Invalid JWT tier configuration.' {'invalid-jwt-tiering'}
              'Unsupported preview substitution.' {'unsupported-substitution'}
              'Preview is not the approved legacy baseline.' {'not-legacy-baseline'}
              'JWT preview requires preview-only dispatch.' {'preview-only-required'}
              'Invalid disabled candidate preparation.' {'invalid-candidate-preparation'}
              'Invalid coexistence preview parameters.' {'invalid-coexistence-inputs'}
              'Live register configuration is required for JWT preview.' {'missing-live-register-config'}
              'Preview command failed.' {'command-failed'}
              'Invalid recovery mode.' {'invalid-recovery-mode'}
              'Recovery baseline cannot be verified.' {'unverified-recovery-baseline'}
              'Recovery apply is not enabled until its preserving-state preview is reviewed.' {'recovery-apply-not-reviewed'}
              'Caller transition requires a reviewed main-branch preview.' {'unreviewed-caller-transition'}
              'Caller transition hold requires reconciliation.' {'caller-transition-held'}
              'Caller artifact source changed.' {'caller-artifact-changed'}
              'Invalid caller readback preview plan.' {'unsafe-readback-preview'}
              'Caller transition requires a completed development baseline.' {'incomplete-development-baseline'}
              'Caller transition cannot overlap a deployment.' {'active-deployment'}
              'Caller ownership key mismatch.' {'caller-owner-key-mismatch'}
              'Caller resource readback failed.' {'caller-readback-failed'}
              'Persist matching caller settings before finalizing.' {'caller-settings-not-persisted'}
              default {'invalid-json-or-schema'}
            }
            @{test='dev-infrastructure-preview';passed=$false;category=$category;rawOutputSuppressed=$true}|ConvertTo-Json -Compress
            exit 1
          }finally{
            if($callerClient){$callerClient.Dispose()}
            if($focusedFile -and (Test-Path -LiteralPath $focusedFile)){Remove-Item -LiteralPath $focusedFile -Force}
            $output=$null;$parameters=$null;$focusedParameters=$null;$document=$null;$template=$null;$account=$null;$apps=$null;$register=$null
            $registerConfig=$null;$authConfigs=$null;$registerDeployment=$null;$namedValues=$null;$desiredPreview=$null;$armToken=$null
          }
          exit 0

      # Provision gate. The first daily schedule always runs the complete two-phase
      # deployment, even if teardown left an RG behind. Later schedules skip only
      # when the preceding deployment wrote its completion marker after phase 2.
      # A failed provision can create the RG but never writes that marker, so the
      # next scheduled run repairs the partial environment before smoke.
      - name: Preflight — does the dev env need provisioning?
        id: preflight
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          PREVIEW_ONLY: ${{ inputs.preview_only && 'true' || 'false' }}
          CALLER_ACTION: ${{ inputs.caller_action || 'none' }}
        run: |
          rg="rg-copilot-byok-${{ matrix.env }}"
          exists=$(az group exists --name "$rg")
          provision=true
          reason="event requires provisioning"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && ( "$PREVIEW_ONLY" == "true" || "$CALLER_ACTION" != 'none' ) ]]; then
            provision=false
            reason="explicit preview or isolated caller transition"
          elif [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_EXPR" != "0 12 * * *" && "$exists" == "true" ]]; then
            completion=$(az group show --name "$rg" --query 'tags.deployDevStatus' -o tsv 2>/dev/null || true)
            if [[ "$completion" == "complete" ]]; then
              provision=false
              reason="completed environment is reusable for smoke"
            else
              reason="resource group exists without a completion marker"
            fi
          elif [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_EXPR" == "0 12 * * *" ]]; then
            reason="first daily schedule always provisions"
          elif [[ "$exists" == "false" ]]; then
            reason="resource group is absent"
          fi

          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "provision=$provision" >> "$GITHUB_OUTPUT"
          echo "RG $rg exists=$exists provision=$provision ($reason)"

      # Self-heal soft-delete collisions BEFORE provisioning. teardown-dev.yml purges
      # tombstones on the clean nightly teardown, but a FAILED provision (or a manual
      # delete) can also leave a soft-deleted APIM / Cognitive Services / Key Vault, and
      # nothing purges those until the next teardown. azd's resource token is deterministic
      # per env name, so the next provision regenerates the SAME names and collides
      # ("A soft-deleted resource with this name exists"). Purge any matching tombstones
      # first so provision is idempotent regardless of what left them. Purge only ever acts
      # on already-deleted resources, so it's safe; a missing tombstone is a no-op. Names:
      # APIM keeps dashes (apim-...-<env>-<token>); Cognitive/KV strip them
      # (aifcopilotbyok<envnodash><token>, kvreg<envnodash><token>).
      #
      # ALSO delete any LIVE APIM in the RG stuck at provisioningState=Failed. A failed
      # APIM VNet-injection activation ("ActivationFailed: Unable to activate API service")
      # leaves the APIM Failed but NOT soft-deleted, and ARM refuses to redeploy over a
      # same-named Failed APIM. Deleting a Failed-state APIM HARD-deletes it (no tombstone),
      # so the name frees immediately and no purge is needed after.
      - name: Purge soft-deleted tombstones (self-heal)
        if: ${{ steps.preflight.outputs.provision == 'true' && !inputs.recover_phase_two }}
        shell: bash
        env:
          ENV_NAME: ${{ matrix.env }}
          LOC: ${{ vars.AZURE_LOCATION }}
        run: |
          set -uo pipefail
          envnodash="${ENV_NAME//-/}"
          rg="rg-copilot-byok-${ENV_NAME}"
          echo "Self-heal: deleting any LIVE APIM stuck in Failed state for '$ENV_NAME'."
          for name in $(az apim list -g "$rg" --query "[?provisioningState=='Failed'].name" -o tsv 2>/dev/null); do
            echo "Deleting Failed-state APIM: $name"
            az apim delete -g "$rg" -n "$name" --yes 2>&1 | tail -n 2 \
              || echo "::warning::APIM delete for Failed '$name' failed"
          done
          # Same treatment for Container Apps managed environments. A regional capacity failure
          # (AKSCapacityHeavyUsage - managed environments are AKS-backed) leaves them in Failed
          # state, and a Failed env then blocks EVERY later run with "a resource with this name
          # already exists or is in a conflicting state". Without this, one Azure-side blip wedges
          # dev until someone deletes them by hand. Observed 2026-08-13 in eastus2.
          # Deleted concurrently: each env delete blocks ~13min (measured), and doing the usual
          # two serially would put the job within minutes of the runner's replicaTimeout.
          echo "Self-heal: deleting any Container Apps managed environment stuck in Failed state."
          pids=""
          for name in $(az containerapp env list -g "$rg" --query "[?properties.provisioningState=='Failed'].name" -o tsv 2>/dev/null); do
            echo "Deleting Failed-state managed environment: $name"
            az containerapp env delete -g "$rg" -n "$name" --yes >/dev/null 2>&1 &
            pids="$pids $!"
          done
          for p in $pids; do
            wait "$p" || echo "::warning::a Failed managed environment delete did not succeed"
          done
          echo "Self-heal: purging any soft-deleted APIM / Cognitive Services / Key Vault for '$ENV_NAME' (loc=$LOC)."
          for name in $(az apim deletedservice list --query "[?contains(name,'${ENV_NAME}')].name" -o tsv 2>/dev/null); do
            echo "Purging soft-deleted APIM: $name"
            az apim deletedservice purge --service-name "$name" --location "$LOC" 2>&1 | tail -n 2 \
              || echo "::warning::APIM purge for '$name' failed (already purged?)"
          done
          for name in $(az cognitiveservices account list-deleted --query "[?contains(name,'${envnodash}')].name" -o tsv 2>/dev/null); do
            echo "Purging soft-deleted Cognitive Services: $name"
            az cognitiveservices account purge --name "$name" --location "$LOC" --resource-group "$rg" 2>&1 | tail -n 2 \
              || echo "::warning::Cognitive Services purge for '$name' failed (already purged?)"
          done
          for name in $(az keyvault list-deleted --query "[?contains(name,'${envnodash}')].name" -o tsv 2>/dev/null); do
            echo "Purging soft-deleted Key Vault: $name"
            az keyvault purge --name "$name" --location "$LOC" 2>&1 | tail -n 2 \
              || echo "::warning::Key Vault purge for '$name' failed (already purged?)"
          done
          echo "Self-heal purge complete."

      - name: Refresh Azure CLI OIDC before phase one
        if: ${{ steps.preflight.outputs.provision == 'true' && !inputs.recover_phase_two }}
        uses: azure/login@v2
        env:
          AZURE_LOGIN_PRE_CLEANUP: 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ steps.cfg.outputs.cloud }}

      # Register-app Easy Auth is a TWO-PHASE bring-up (the redirect URI needs the
      # Container App FQDN, which doesn't exist until the first provision):
      #   phase 1  : provision hosting + Key Vault + UAMI (Easy Auth params empty -> auth off)
      #   deploy   : push the real Blazor image
      #   setup    : create the app reg + store its secret in Key Vault (degrades to manual)
      #   phase 2  : provision again (Easy Auth params now populated -> login attached)
      - name: azd provision (phase 1 — hosting + Key Vault)
        if: ${{ steps.preflight.outputs.provision == 'true' && !inputs.recover_phase_two }}
        # Bounded retry to ride out the transient APIM Internal VNet-injection
        # "ActivationFailed: Unable to activate API service at this time ... this could be a
        # temporary issue in the region" flake (aka.ms/apiminternalvnet). It hits comm-dev
        # (eastus2) intermittently — the SAME template provisions gov-dev green in the same
        # run and comm-dev succeeds on most runs — so it's region-side, not config. A failed
        # activation leaves the APIM at provisioningState=Failed, which then blocks a same-name
        # redeploy; between attempts we delete it (hard-delete, no tombstone) so the retry
        # re-creates it clean. Everything else in phase 1 is idempotent, so re-running is safe.
        shell: bash
        run: |
          set -uo pipefail
          rg="rg-copilot-byok-${{ matrix.env }}"
          max=2
          attempt=1
          while :; do
            echo "::group::azd provision (phase 1) attempt ${attempt}/${max}"
            if azd provision --no-prompt; then
              echo "::endgroup::"
              echo "Provision succeeded on attempt ${attempt}."
              break
            else
              rc=$?
              echo "::endgroup::"
              if [ "${attempt}" -ge "${max}" ]; then
                echo "::error::azd provision failed after ${attempt} attempt(s) (exit ${rc})."
                exit "${rc}"
              fi
              echo "::warning::azd provision attempt ${attempt} failed (exit ${rc}); clearing Failed-state APIM / managed environments and retrying (likely transient APIM VNet-injection activation or regional Container Apps capacity)."
              for name in $(az apim list -g "${rg}" --query "[?provisioningState=='Failed'].name" -o tsv 2>/dev/null); do
                echo "Deleting Failed-state APIM before retry: ${name}"
                az apim delete -g "${rg}" -n "${name}" --yes 2>&1 | tail -n 2 \
                  || echo "::warning::APIM delete for Failed '${name}' failed"
              done
              # A Failed managed environment blocks the retry with a name conflict, so the in-run
              # retry is useless without this - which is what happened on 2026-08-13. Concurrent
              # for the same replicaTimeout reason as the preflight self-heal above.
              pids=""
              for name in $(az containerapp env list -g "${rg}" --query "[?properties.provisioningState=='Failed'].name" -o tsv 2>/dev/null); do
                echo "Deleting Failed-state managed environment before retry: ${name}"
                az containerapp env delete -g "${rg}" -n "${name}" --yes >/dev/null 2>&1 &
                pids="$pids $!"
              done
              for p in $pids; do
                wait "$p" || echo "::warning::a Failed managed environment delete did not succeed"
              done
              attempt=$((attempt + 1))
              echo "Waiting 60s before retry..."
              sleep 60
            fi
          done
        env:
          BYOK_RESPONSE_OWNER_KEY: ${{ secrets.BYOK_RESPONSE_OWNER_KEY }}
          BYOK_RESPONSE_OWNER_PREVIOUS_KEY: ${{ secrets.BYOK_RESPONSE_OWNER_PREVIOUS_KEY }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          APIM_PUBLISHER_EMAIL: ${{ vars.APIM_PUBLISHER_EMAIL }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_APP_ID_URI: ${{ vars.API_APP_ID_URI }}
          API_AUDIENCE: ${{ vars.API_AUDIENCE }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Empty on phase 1 so the register Easy Auth params substitute to '' (auth stays off).
          REGISTER_EASYAUTH_CLIENT_ID: ''
          REGISTER_EASYAUTH_SECRET_KV_URI: ''
          # Phase 1 predates the image build; '' selects the sample so the first revision is healthy.
          REGISTER_APP_IMAGE: ''
          # Commercial only: let the preprovision hook create/verify the BYOK tier groups.
          MANAGE_BYOK_GROUPS: ${{ startsWith(matrix.env, 'comm') && 'true' || '' }}

      - name: Refresh Azure CLI OIDC before register image deployment
        if: ${{ steps.preflight.outputs.provision == 'true' && !inputs.recover_phase_two }}
        uses: azure/login@v2
        env:
          AZURE_LOGIN_PRE_CLEANUP: 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ steps.cfg.outputs.cloud }}

      - name: Deploy register app image
        if: ${{ steps.preflight.outputs.provision == 'true' && !inputs.recover_phase_two }}
        shell: bash
        run: |
          azd deploy register --no-prompt
          # Hand the just-pushed tag to phase 2. Without this main.bicep re-applies its sample
          # default and the follow-up provision reverts the app (register-auth then 404s).
          rg="rg-copilot-byok-${{ matrix.env }}"
          img="$(az containerapp list -g "$rg" --query "[?tags.\"azd-service-name\"=='register'].properties.template.containers[0].image | [0]" -o tsv 2>/dev/null || true)"
          echo "Deployed register image: ${img:-<unresolved>}"
          echo "REGISTER_APP_IMAGE=${img}" >> "$GITHUB_ENV"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          # The workflow uses azd's default project environment (no AZURE_ENV_NAME), and the RG
          # is created subscription-scoped by main.bicep, so azd can't infer the deploy target.
          # Point it at the deterministic RG (rg-copilot-byok-<env>) holding the tagged app.
          AZURE_RESOURCE_GROUP: rg-copilot-byok-${{ matrix.env }}

      - name: Refresh Azure CLI OIDC before Easy Auth setup
        if: ${{ steps.preflight.outputs.provision == 'true' && !inputs.recover_phase_two }}
        uses: azure/login@v2
        env:
          AZURE_LOGIN_PRE_CLEANUP: 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ steps.cfg.outputs.cloud }}

      - name: Easy Auth setup (app reg + secret -> Key Vault)
        # Idempotent + degrades to a printed manual command when the deploy principal lacks
        # Entra app-management rights (expected in Gov) — never fails the deployment; Easy
        # Auth simply stays off until an admin runs it.
        if: ${{ steps.preflight.outputs.provision == 'true' && !inputs.recover_phase_two }}
        shell: bash
        run: |
          rg="rg-copilot-byok-${{ matrix.env }}"
          # Prefer azd outputs when present, but the workflow runs in azd's DEFAULT project env
          # (no AZURE_ENV_NAME), so `azd env get-values` is usually EMPTY here — which silently
          # skipped Easy Auth on every CI-managed env. Resolve fqdn/kv straight from Azure as the
          # reliable source: the app carries the azd-service-name=register tag and the register
          # Key Vault name starts with 'kvreg'. (Linux runner -> JMESPath --query is safe.)
          vals="$(azd env get-values 2>/dev/null || true)"
          fqdn="$(printf '%s\n' "$vals" | sed -n 's/^REGISTER_APP_FQDN="\?\([^"]*\)"\?$/\1/p')"
          kv="$(printf '%s\n' "$vals" | sed -n 's/^REGISTER_KEY_VAULT_NAME="\?\([^"]*\)"\?$/\1/p')"
          if [ -z "$fqdn" ]; then
            fqdn="$(az containerapp list -g "$rg" --query "[?tags.\"azd-service-name\"=='register'].properties.configuration.ingress.fqdn | [0]" -o tsv 2>/dev/null || true)"
          fi
          if [ -z "$kv" ]; then
            kv="$(az keyvault list -g "$rg" --query "[?starts_with(name,'kvreg')].name | [0]" -o tsv 2>/dev/null || true)"
          fi
          ./scripts/setup-register-entra.sh "$fqdn" "$kv" "${{ matrix.env }}"
          # Guarantee the phase-2 provision sees these defined even if setup degraded.
          grep -q '^REGISTER_EASYAUTH_CLIENT_ID='     "$GITHUB_ENV" || echo "REGISTER_EASYAUTH_CLIENT_ID="     >> "$GITHUB_ENV"
          grep -q '^REGISTER_EASYAUTH_SECRET_KV_URI=' "$GITHUB_ENV" || echo "REGISTER_EASYAUTH_SECRET_KV_URI=" >> "$GITHUB_ENV"

      - name: Refresh Azure CLI OIDC before phase two
        if: ${{ steps.preflight.outputs.provision == 'true' }}
        uses: azure/login@v2
        env:
          AZURE_LOGIN_PRE_CLEANUP: 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ steps.cfg.outputs.cloud }}

      - name: azd provision (phase 2 — attach Easy Auth)
        # REGISTER_EASYAUTH_* arrive via $GITHUB_ENV from the setup step, which DEGRADES when the
        # deploy principal lacks Entra app-management rights (it does, in both clouds) and then
        # writes an EMPTY value. Fall back to the environment vars an admin published by running
        # setup-register-entra by hand, same precedence deploy.yml uses for the pilots.
        #
        # This was tried and reverted on 2026-08-10 because it turned a harmless "Easy Auth off"
        # into a HARD provision failure: the dev register vault had no route in (public access
        # requested, no private endpoint, and the commercial policy forces publicNetworkAccess to
        # Disabled), so the Container App MI could not resolve the secret ref. Fixed for real by
        # `registerVnetIntegrated: true` (#137) — the vault now has a private endpoint and the
        # register env is VNet-integrated, so the reference resolves. Re-enabled on that basis.
        if: ${{ steps.preflight.outputs.provision == 'true' }}
        run: azd provision --no-prompt
        env:
          BYOK_RESPONSE_OWNER_KEY: ${{ secrets.BYOK_RESPONSE_OWNER_KEY }}
          BYOK_RESPONSE_OWNER_PREVIOUS_KEY: ${{ secrets.BYOK_RESPONSE_OWNER_PREVIOUS_KEY }}
          REGISTER_EASYAUTH_CLIENT_ID: ${{ env.REGISTER_EASYAUTH_CLIENT_ID || vars.REGISTER_EASYAUTH_CLIENT_ID }}
          REGISTER_EASYAUTH_SECRET_KV_URI: ${{ env.REGISTER_EASYAUTH_SECRET_KV_URI || vars.REGISTER_EASYAUTH_SECRET_KV_URI }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          APIM_PUBLISHER_EMAIL: ${{ vars.APIM_PUBLISHER_EMAIL }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_APP_ID_URI: ${{ vars.API_APP_ID_URI }}
          API_AUDIENCE: ${{ vars.API_AUDIENCE }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Set by the deploy step above; keeps the real image instead of reverting to the sample.
          REGISTER_APP_IMAGE: ${{ env.REGISTER_APP_IMAGE }}
          MANAGE_BYOK_GROUPS: ${{ startsWith(matrix.env, 'comm') && 'true' || '' }}

      - name: Refresh Azure CLI OIDC before completion marker
        if: ${{ steps.preflight.outputs.provision == 'true' }}
        uses: azure/login@v2
        env:
          AZURE_LOGIN_PRE_CLEANUP: 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ steps.cfg.outputs.cloud }}

      - name: Mark dev environment complete
        if: ${{ steps.preflight.outputs.provision == 'true' }}
        shell: bash
        run: |
          az group update \
            --name "rg-copilot-byok-${{ matrix.env }}" \
            --set tags.deployDevStatus=complete \
                  tags.deployDevCompletedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output none

      - name: Skip note (env already present)
        if: ${{ steps.preflight.outputs.provision == 'false' }}
        run: echo "Development provisioning skipped by preflight; preview-only dispatches also skip smoke."

  smoke-comm-dev:
    name: Smoke comm-dev
    needs: [matrix, provision]
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.smoke && !inputs.preview_only && !inputs.recover_phase_two && inputs.caller_action == 'none')) && contains(needs.matrix.outputs.envs, 'comm-dev') }}
    uses: ./.github/workflows/smoke-test.yml
    with:
      env: comm-dev

  smoke-gov-dev:
    name: Smoke gov-dev
    needs: [matrix, provision]
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.smoke && !inputs.preview_only && !inputs.recover_phase_two && inputs.caller_action == 'none')) && contains(needs.matrix.outputs.envs, 'gov-dev') }}
    uses: ./.github/workflows/smoke-test.yml
    with:
      env: gov-dev
