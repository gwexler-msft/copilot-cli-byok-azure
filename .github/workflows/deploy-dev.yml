            $required=@{'entra-openid-config-url'='https://'+$loginHost+'/'+$Parameters.entraTenantId.value+'/v2.0/.well-known/openid-configuration';
              'api-audience'=$Parameters.apiAudience.value;'required-scope'=$Parameters.requiredScope.value;
