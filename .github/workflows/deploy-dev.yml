# Auto-deploy to the ephemeral dev envs on every push to main, then chain
# into smoke-test for an end-to-end regression check. Explicit manual caller
# transitions may target one pilot; full pilot provisioning stays in deploy.yml.
#
# This workflow is also the SCHEDULED smoke entry point (it owns the cron, not
# smoke-test.yml). Smoke needs a dev runner that is VNet-injected into the dev
# env to reach APIM Internal; that runner only exists while the dev env exists.
# teardown-dev.yml deletes the dev RGs nightly at 00:00 UTC (8pm ET), so a smoke-only
# cron would hang forever against a torn-down env (no runner -> job queues ~24h).
# Instead the schedule drives THIS workflow. The first daily run proactively
# provisions the env; later runs reuse it only when the complete deployment marker
# is present, then chain smoke. Net daily lifecycle (America/New_York):
#   00:00 UTC (8pm ET) teardown -> 12:00 UTC (8am ET) clean provision + smoke ->
#   15/18/21:00 UTC smoke-only (env reused, provision SKIPPED). The 8pm-8am ET gap
#   leaves the dev envs DOWN ~12h overnight so we don't host what we won't use.
#
# Cost shape: each push/first-of-day spins up Foundry + APIM Developer + 1 ACA
# Job runner in each cloud (~$0/hr idle; ~cents per smoke). Subsequent same-day
# smokes are runner-only (no redeploy). teardown-dev.yml reclaims it all nightly.
name: deploy-dev

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'policies/**'
      - 'azure.yaml'
      # provision/postprovision hook scripts (azure.yaml `hooks:`) run during a
      # deploy but live under scripts/; include them so a hook fix actually gets
      # exercised by deploy-dev instead of waiting for an unrelated infra push.
      - 'scripts/**'
      # Register app source (#64): a code-only change auto-redeploys the rebuilt
      # image to the dev envs via the existing `azd deploy register` step.
      - 'app/register/**'
      - '.github/workflows/deploy-dev.yml'
      - '.github/workflows/smoke-test.yml'
  schedule:
    # 12:00 UTC (8am ET): proactively runs a complete provision after the nightly teardown.
    # 15/18/21 UTC: reuse the env only when phase 2 wrote the completion marker; otherwise repair
    # the partial deployment before smoke. The envs stay DOWN 8pm-8am ET (~12h). GitHub cron is
    # fixed-UTC / no DST, so under EST these land an hour earlier in local time. Working late?
    # Manually dispatch deploy-dev to bring the envs back any time.
    #
    # The smoke crons live HERE, not on smoke-test.yml, because a smoke job runs on a runner that
    # only exists INSIDE the dev env — scheduling smoke independently just queues it against a
    # torn-down env. Measured 2026-08-13: jobs queued 16-18.5h, and one of them finally started
    # mid-provision and reported three bogus failures. deploy-dev is the only workflow that can
    # guarantee the env exists first, because it lazily (re)provisions before chaining.
    #
    # The earlier objection to keeping them here — that a smoke-only run would cancel a pending real
    # deploy — was a symptom of the WORKFLOW-level lock, which made the whole run pending. The lock
    # is now per-env and job-level (see `provision`), so orchestration jobs never queue behind it.
    - cron: '0 12 * * *'
    - cron: '0 15,18,21 * * *'
  workflow_dispatch:
    inputs:
      smoke:
        description: Run smoke-test after deploy
        type: boolean
        default: true
      envs:
        description: Dev envs to deploy; one comm-pilot or gov-pilot is allowed only with caller_action and smoke=false
        type: string
        default: comm-dev,gov-dev
      preview_only:
        description: Validate and preview the selected dev environments without provisioning or smoke
        type: boolean
        default: false
      preview_jwt:
        description: Preview Entra/native-key coexistence using stored dev keys; requires preview_only
        type: boolean
        default: false
      preview_apim_only:
        description: Preview only existing Foundry APIM caller resources; requires preview_only and preview_jwt
        type: boolean
        default: false
      recover_phase_two:
        description: Recover comm-dev phase two only; requires smoke=false and reviewed recovery preview
        type: boolean
        default: false
      caller_action:
        description: Manual APIM-only caller transition; use preview_only first, one environment and smoke=false
        type: choice
        options: [none, activate, rollback, finalize]
        default: none
      caller_preview_digest:
        description: Exact reviewed caller-preview fingerprint required for a non-preview main-branch transition
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

# NO workflow-level concurrency on purpose. The dev-env lifecycle lock is per-env and lives on the
# jobs that actually touch an env (`provision` below, `teardown` in teardown-dev.yml, and
# smoke-test.yml's own group). A workflow-level lock made the whole RUN pending, which coupled
# comm-dev to gov-dev and let a newly queued run cancel a pending one before it had done any work.

jobs:
  matrix:
    name: Build dev matrix
    # Self-hosted (#52). Hosted runners are disabled at the EMU enterprise level
    # for this repo, so every job in every workflow must target the pilot's
    # KEDA-scaled ACA Job runner (label = envName = `comm-pilot`).
    runs-on: [self-hosted, comm-pilot]
    outputs:
      envs: ${{ steps.build.outputs.envs }}
    steps:
      - id: build
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            raw='${{ inputs.envs }}'
          else
            raw='comm-dev,gov-dev'
          fi
          # csv -> JSON array, trim whitespace, dedupe
          envs=$(echo "$raw" | tr ',' '\n' | awk 'NF' | sort -u \
            | jq -R . | jq -sc .)
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "Will deploy: $envs"

  provision:
    name: Provision ${{ matrix.env }}
    needs: matrix
    if: needs.matrix.outputs.envs != '[]'
    # The dev env's own runner doesn't exist yet (we're about to create it), so
    # bootstrap provisioning has to run on the matching cloud's pilot runner.
    # Routing: comm-dev -> comm-pilot (AzureCloud); gov-dev -> gov-pilot (AzureUSGovernment).
    # Each pilot's UAMI must hold the FIC for the dev env it bootstraps (#53).
    runs-on: [self-hosted, "${{ (matrix.env == 'gov-dev' || matrix.env == 'gov-pilot') && 'gov-pilot' || 'comm-pilot' }}"]
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.matrix.outputs.envs) }}
    environment: ${{ matrix.env }}
    # SHARED per-env lifecycle lock with teardown-dev.yml's `teardown` job and smoke-test.yml
    # (identical `dev-env-<env>` group): provisioning, tearing down and smoking the SAME env must
    # never overlap. A scheduled deploy-dev once raced a manual teardown and the env was deleted out
    # from under its smoke jobs. Never cancel in-flight — neither `azd provision` nor
    # `az group delete` is safe to interrupt, so queue instead of cancelling.
    concurrency:
      group: dev-env-${{ matrix.env }}
      cancel-in-progress: false
    timeout-minutes: ${{ endsWith(matrix.env, '-dev') && 70 || 60 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install azd (skip if pre-baked)
        shell: bash
        run: |
          if ! command -v azd >/dev/null 2>&1; then
            echo "azd not found — installing"
            curl -fsSL https://aka.ms/install-azd.sh | sudo bash
          else
            echo "azd already installed: $(azd version)"
          fi

      - name: Resolve per-env config
        id: cfg
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_ONLY: ${{ inputs.preview_only && 'true' || 'false' }}
          PREVIEW_JWT: ${{ inputs.preview_jwt && 'true' || 'false' }}
          RECOVER_PHASE_TWO: ${{ inputs.recover_phase_two && 'true' || 'false' }}
          REQUESTED_ENVS: ${{ inputs.envs }}
          REQUESTED_SMOKE: ${{ inputs.smoke && 'true' || 'false' }}
          CALLER_ACTION: ${{ inputs.caller_action || 'none' }}
        run: |
          case "$CALLER_ACTION" in
            none) ;;
            activate|rollback|finalize)
              if [[ "$EVENT_NAME" != 'workflow_dispatch' || ! "$REQUESTED_ENVS" =~ ^(comm|gov)-(dev|pilot)$ || "$REQUESTED_SMOKE" != 'false' || "$RECOVER_PHASE_TWO" == 'true' || "$PREVIEW_JWT" == 'true' || '${{ inputs.preview_apim_only }}' == 'true' ]]; then
                echo '::error::Caller transition requires one known environment, manual dispatch, smoke=false and no recovery/JWT preview flags.'
                exit 2
              fi
              ;;
            *) echo '::error::Unknown caller action.'; exit 2 ;;
          esac
          if [[ "$RECOVER_PHASE_TWO" == "true" && ( "$REQUESTED_ENVS" != "comm-dev" || "$REQUESTED_SMOKE" != "false" || "$PREVIEW_JWT" == "true" || '${{ inputs.preview_apim_only }}' == 'true' ) ]]; then
            echo "::error::Phase-two recovery requires comm-dev only, smoke=false and no JWT preview flags."
            exit 2
          fi
          if [[ "$PREVIEW_JWT" == "true" && "$PREVIEW_ONLY" != "true" ]]; then
            echo "::error::JWT candidate preview requires preview_only; no deployment was started."
            exit 2
          fi
          if [[ '${{ inputs.preview_apim_only }}' == 'true' && ( "$PREVIEW_ONLY" != "true" || "$PREVIEW_JWT" != "true" ) ]]; then
            echo "::error::APIM caller preview requires both preview flags; no deployment was started."
            exit 2
          fi
          case "${{ matrix.env }}" in
            comm-dev)
              echo "cloud=AzureCloud"                                  >> "$GITHUB_OUTPUT"
              echo "params=infra/main.parameters.ci.commercial-dev.json" >> "$GITHUB_OUTPUT"
              ;;
            gov-dev)
              echo "cloud=AzureUSGovernment"                           >> "$GITHUB_OUTPUT"
              echo "params=infra/main.parameters.ci.gov-dev.json"      >> "$GITHUB_OUTPUT"
              ;;
            comm-pilot|gov-pilot)
              if [[ "$CALLER_ACTION" == 'none' ]]; then
                echo '::error::Pilot targets permit only explicit APIM caller transitions.'
                exit 2
              fi
              if [[ '${{ matrix.env }}' == 'gov-pilot' ]]; then
                echo 'cloud=AzureUSGovernment' >> "$GITHUB_OUTPUT"
                echo 'params=infra/main.parameters.ci.gov.json' >> "$GITHUB_OUTPUT"
              else
                echo 'cloud=AzureCloud' >> "$GITHUB_OUTPUT"
                echo 'params=infra/main.parameters.ci.commercial.json' >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo '::error::Unknown environment; no deployment was started.'
              exit 2
              ;;
          esac

      - name: Stage CI parameters
        run: |
          azd config set cloud.name "${{ steps.cfg.outputs.cloud }}"
          cp "${{ steps.cfg.outputs.params }}" infra/main.parameters.json
          bash scripts/check-provision-params.sh --stage-caller-auth infra/main.parameters.json
        env:
          BYOK_CALLER_AUTH_PREPARATION: ${{ vars.BYOK_CALLER_AUTH_PREPARATION }}
          BYOK_CALLER_AUTH_ROLLOUT: ${{ vars.BYOK_CALLER_AUTH_ROLLOUT }}
          BYOK_CALLER_JWT_TIERING: ${{ vars.BYOK_CALLER_JWT_TIERING }}
          BYOK_RESPONSE_OWNER_KEY: ${{ secrets.BYOK_RESPONSE_OWNER_KEY }}
          BYOK_RESPONSE_OWNER_PREVIOUS_KEY: ${{ secrets.BYOK_RESPONSE_OWNER_PREVIOUS_KEY }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_AUDIENCE: ${{ vars.API_AUDIENCE }}

      - name: azd auth login (OIDC)
        run: |
          azd auth login \
            --client-id "${{ vars.AZURE_CLIENT_ID }}" \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}" \
            --federated-credential-provider github

      # Self-hosted ACA Job runner image (myoung34/github-runner) ships azd but
      # NOT az. azure/login@v2 shells out to `az`, so install it on demand.
      # Idempotent — no-op if a prior step (or pre-baked image) already has it.
      - name: Install Azure CLI (self-hosted runner)
        shell: bash
        run: |
          if ! command -v az >/dev/null 2>&1; then
            echo "az not found — installing"
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          else
            echo "az already installed: $(az version --query '"azure-cli"' -o tsv)"
          fi

      - name: Azure CLI login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ steps.cfg.outputs.cloud }}

      - name: Guard private client access
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ matrix.env }}
          TARGET_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TARGET_CLOUD: ${{ steps.cfg.outputs.cloud }}
          GUARD_CALLER_TRANSITION: ${{ (inputs.caller_action == '' || inputs.caller_action == 'none') && 'true' || 'false' }}
        run: ./scripts/check-private-client-access-hold.ps1 -EnvironmentName $env:TARGET_ENVIRONMENT -SubscriptionId $env:TARGET_SUBSCRIPTION -Cloud $env:TARGET_CLOUD -IncludeCallerTransition:($env:GUARD_CALLER_TRANSITION -ceq 'true')

      - name: Guard caller transition hold
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.caller_action == 'none' }}
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ matrix.env }}
        run: |
          set -euo pipefail
          rg="rg-copilot-byok-${TARGET_ENVIRONMENT}"
          exists=$(az group exists --name "$rg" --output tsv --only-show-errors)
          if [[ "$exists" != 'true' && "$exists" != 'false' ]]; then
            echo '::error::Cannot verify the caller transition hold.'
            exit 2
          fi
          if [[ "$exists" == 'true' ]]; then
            hold=$(az group show --name "$rg" --query 'tags.byokCallerTransition' --output tsv --only-show-errors)
            if [[ -n "$hold" ]]; then
              echo '::error::A caller transition requires operator reconciliation before provisioning.'
              exit 2
            fi
          fi

      - name: Resolve register assignment for full preview
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.preview_only || inputs.recover_phase_two) && inputs.caller_action == 'none' && !inputs.preview_apim_only }}
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: ./scripts/resolve-register-role-assignment.ps1 -Stage

      - name: Preview development infrastructure only
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.preview_only || inputs.recover_phase_two || inputs.caller_action != 'none') }}
        shell: pwsh
        env:
          PREVIEW_ENVIRONMENT: ${{ matrix.env }}
          PREVIEW_ONLY: ${{ inputs.preview_only && 'true' || 'false' }}
          PREVIEW_JWT: ${{ inputs.preview_jwt && 'true' || 'false' }}
          PREVIEW_APIM_ONLY: ${{ inputs.preview_apim_only && 'true' || 'false' }}
          RECOVER_PHASE_TWO: ${{ inputs.recover_phase_two && 'true' || 'false' }}
          CALLER_ACTION: ${{ inputs.caller_action || 'none' }}
          CALLER_PREVIEW_DIGEST: ${{ inputs.caller_preview_digest }}
          BYOK_RESPONSE_OWNER_KEY: ${{ secrets.BYOK_RESPONSE_OWNER_KEY }}
          BYOK_RESPONSE_OWNER_PREVIOUS_KEY: ${{ secrets.BYOK_RESPONSE_OWNER_PREVIOUS_KEY }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          APIM_PUBLISHER_EMAIL: ${{ vars.APIM_PUBLISHER_EMAIL }}
          ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          API_APP_ID_URI: ${{ vars.API_APP_ID_URI }}
          API_AUDIENCE: ${{ vars.API_AUDIENCE }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          REGISTER_EASYAUTH_CLIENT_ID: ${{ inputs.preview_jwt && vars.REGISTER_EASYAUTH_CLIENT_ID || '' }}
          REGISTER_EASYAUTH_SECRET_KV_URI: ${{ inputs.preview_jwt && vars.REGISTER_EASYAUTH_SECRET_KV_URI || '' }}
          REGISTER_APP_IMAGE: ''
          MANAGE_BYOK_GROUPS: ''
        run: |
          $ErrorActionPreference='Stop'
          function Assert-DevCallerGroup {
            param($Group,[string]$Environment,[string]$SubscriptionId)
            $expectedId='/subscriptions/'+$SubscriptionId+'/resourceGroups/rg-copilot-byok-'+$Environment
            if($Environment -cnotin @('comm-dev','gov-dev','comm-pilot','gov-pilot') -or
              $SubscriptionId -cnotmatch '\A[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\z' -or
              $Group -isnot [Collections.IDictionary] -or $Group.id -ine $expectedId -or
              $Group.properties.provisioningState -cne 'Succeeded' -or
              ($Environment -clike '*-dev' -and $Group.tags.deployDevStatus -cne 'complete')){
              throw 'Caller transition requires its healthy existing baseline.'
            }
          }
          function Get-DevCallerServiceId {
            param($Deployment,[string]$GroupId)
            if($GroupId -inotmatch '\A/subscriptions/[0-9a-f-]{36}/resourceGroups/rg-copilot-byok-(?:comm|gov)-(?:dev|pilot)\z' -or
              $Deployment.id -ine ($GroupId+'/providers/Microsoft.Resources/deployments/apim') -or
              $Deployment.properties.provisioningState -cne 'Succeeded' -or
              $Deployment.properties.outputs.apimName.value -cnotmatch '\A[A-Za-z0-9][A-Za-z0-9-]{0,63}\z'){
              throw 'The exact APIM deployment reference cannot be verified.'
            }
            $GroupId+'/providers/Microsoft.ApiManagement/service/'+$Deployment.properties.outputs.apimName.value
          }
          function Read-DevApimPreviewCollection {
            param([string]$ArmBase,[string]$ServiceId,[string]$Path,[scriptblock]$ReadPage)
            if($ArmBase -cnotin @('https://management.azure.com','https://management.usgovcloudapi.net') -or
              $ServiceId -inotmatch '\A/subscriptions/[0-9a-f-]{36}/resourceGroups/rg-copilot-byok-(?:comm|gov)-(?:dev|pilot)/providers/Microsoft.ApiManagement/service/[A-Za-z0-9-]+\z' -or
              ($Path -cnotin @('/namedValues','/policyFragments','/products','/apis/copilot-byok-foundry/operations','/apis/copilot-byok-foundry/products') -and
                $Path -cnotmatch '\A/products/[A-Za-z0-9_-]{1,80}/apis\z') -or $null -eq $ReadPage){throw 'Invalid APIM inventory scope.'}
            $origin=[uri]($ArmBase+$ServiceId+$Path+'?api-version=2024-05-01')
            $next=$origin.AbsoluteUri
            $pages=[Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            $names=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $items=[Collections.Generic.List[object]]::new()
            while($next){
              $uri=[uri]$next
              if(-not $uri.IsAbsoluteUri -or $uri.Scheme -cne 'https' -or $uri.Authority -ine $origin.Authority -or
                $uri.AbsolutePath -ine $origin.AbsolutePath -or $uri.UserInfo -or $uri.Fragment -or $pages.Count -ge 20 -or
                -not $pages.Add($uri.AbsoluteUri)){throw 'Invalid APIM inventory pagination.'}
              $query=[System.Web.HttpUtility]::ParseQueryString($uri.Query)
              if($query['api-version'] -cne '2024-05-01'){throw 'Invalid APIM inventory pagination.'}
              $page=& $ReadPage $uri.AbsoluteUri
              if($page -isnot [Collections.IDictionary] -or $page.value -isnot [array] -or $page.error){throw 'Incomplete live APIM inventory.'}
              foreach($entry in $page.value){
                if($entry -isnot [Collections.IDictionary] -or $entry.name -isnot [string] -or
                  [string]::IsNullOrWhiteSpace($entry.name) -or -not $names.Add($entry.name)){throw 'Duplicate or invalid APIM inventory entry.'}
                $items.Add($entry)
              }
              if($page.Contains('nextLink') -and $null -ne $page.nextLink -and $page.nextLink -isnot [string]){throw 'Invalid APIM inventory pagination.'}
              $next=[string]$page.nextLink
            }
            @{value=$items.ToArray()}
          }
          function Get-DevPreviewSummary {
            param([string]$Output,[string]$Environment,[string]$SubscriptionId,[string]$ApimResourceId='',[string[]]$ExpectedApimPaths=@(),[bool]$SharedOnly=$false)
            if($Environment -cnotin @('comm-dev','gov-dev','comm-pilot','gov-pilot') -or
              ($Environment -clike '*-pilot' -and -not $ApimResourceId) -or
              $SubscriptionId -notmatch '\A[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\z' -or $Output.Length -gt 16777216){throw 'Invalid preview context.'}
            $preview=ConvertFrom-Json -InputObject $Output -AsHashtable
            if($preview.status -cne 'Succeeded' -or $preview.error -or $preview.changes -isnot [array] -or $preview.changes.Count -eq 0){throw 'Incomplete ARM preview.'}
            $groupId='/subscriptions/'+$SubscriptionId+'/resourceGroups/rg-copilot-byok-'+$Environment
            $operations=@()
            $seen=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $expected=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $evaluated=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            if($ApimResourceId){
              if(-not $ApimResourceId.StartsWith($groupId+'/providers/Microsoft.ApiManagement/service/',[StringComparison]::OrdinalIgnoreCase) -or
                $ApimResourceId.Substring($groupId.Length+1).Split('/').Count -ne 4 -or
                $ExpectedApimPaths.Count -ne $(if($SharedOnly){48}else{49})){throw 'Invalid preview context.'}
              foreach($path in $ExpectedApimPaths){if(-not $expected.Add($ApimResourceId+'/'+$path)){throw 'Invalid preview context.'}}
            }elseif($ExpectedApimPaths.Count -or $SharedOnly){throw 'Invalid preview context.'}
            foreach($change in $preview.changes){
              $operation=$change.changeType
              $resourceId=$change.resourceId
              if($operation -cnotin @('Create','Modify','Delete','Deploy','Ignore','NoChange','Unsupported') -or
                $resourceId -isnot [string] -or -not $seen.Add($resourceId) -or
                -not $resourceId.StartsWith('/subscriptions/'+$SubscriptionId+'/',[StringComparison]::OrdinalIgnoreCase)) {throw 'Invalid ARM resource change.'}
              $inScope=$resourceId.Equals($groupId,[StringComparison]::OrdinalIgnoreCase) -or
                $resourceId.StartsWith($groupId+'/providers/',[StringComparison]::OrdinalIgnoreCase)
              if(-not $inScope -and $operation -cnotin @('Ignore','NoChange')){throw 'Preview changes another scope.'}
              if($ApimResourceId){
                $inScope=$expected.Contains($resourceId)
                if(-not $inScope -and $operation -cnotin @('Ignore','NoChange')){throw 'Preview changes an unapproved APIM resource.'}
                if($inScope -and $operation -cin @('Create','Modify','NoChange')){[void]$evaluated.Add($resourceId)}
                if($resourceId -ieq ($ApimResourceId+'/apis/copilot-byok-foundry')){
                  $state=$change.after ?? $change.before
                  if($state.properties.subscriptionRequired -ne $true -or $state.properties.subscriptionKeyParameterNames.header -cne 'api-key' -or
                    $state.properties.subscriptionKeyParameterNames.query -cne 'api-key'){throw 'Preview changes native subscription admission.'}
                }
              }
              if($resourceId -imatch '\A/subscriptions/[^/]+/resourceGroups/[^/]+\z'){
                $type='Microsoft.Resources/resourceGroups'
              }else{
                $providerIndex=$resourceId.LastIndexOf('/providers/',[StringComparison]::OrdinalIgnoreCase)
                if($providerIndex -lt 0){throw 'Invalid ARM resource change.'}
                $segments=$resourceId.Substring($providerIndex+11).Split('/')
                if($segments.Count -lt 3 -or $segments.Count%2 -ne 1){throw 'Invalid ARM resource change.'}
                $type=$segments[0]
                for($segmentIndex=1;$segmentIndex -lt $segments.Count;$segmentIndex+=2){$type+='/'+$segments[$segmentIndex]}
                if($type -inotmatch '\AMicrosoft\.[A-Za-z]+(?:/[A-Za-z][A-Za-z0-9]*)+\z'){throw 'Invalid ARM resource change.'}
              }
              $operations+=@{operation=$operation;resourceType=$type;inScope=$inScope}
            }
            $blocked=@($operations|Where-Object {$_.operation -cin @('Delete','Unsupported','Deploy') -or ($_.inScope -and $_.operation -ceq 'Ignore')})
            $diagnostics=@($preview.diagnostics|Where-Object {$null -ne $_})
            $diagnosticCategories=@($diagnostics|ForEach-Object {
              switch -CaseSensitive ($_.code){
                'NestedDeploymentShortCircuited' {'nested-deployment-short-circuited'}
                'ResourceNotSupported' {'unsupported-resource'}
                'AuthorizationFailed' {'authorization'}
                'RequestDisallowedByPolicy' {'policy'}
                'InvalidTemplate' {'template'}
                default {'other'}
              }
            }|Group-Object|Sort-Object Name|ForEach-Object {@{category=$_.Name;count=$_.Count}})
            $requiredTypes=@('Microsoft.Resources/resourceGroups','Microsoft.ApiManagement/service','Microsoft.CognitiveServices/accounts',
              'Microsoft.App/managedEnvironments','Microsoft.App/jobs','Microsoft.App/containerApps','Microsoft.ContainerRegistry/registries',
              'Microsoft.KeyVault/vaults','Microsoft.ContainerInstance/containerGroups','Microsoft.Network/virtualNetworks')
            if($ApimResourceId){$requiredTypes=@()}
            $evaluatedTypes=@($operations|Where-Object {$_.inScope -and $_.operation -cin @('Create','Modify','NoChange')}|ForEach-Object resourceType)
            $missingTypes=@($requiredTypes|Where-Object {$_ -inotin $evaluatedTypes})
            $missingExpected=@($expected|Where-Object {-not $evaluated.Contains($_)}).Count
            $counts=@($operations|Group-Object operation,resourceType,inScope|Sort-Object Name|ForEach-Object {@{operation=$_.Group[0].operation;resourceType=$_.Group[0].resourceType;inScope=$_.Group[0].inScope;count=$_.Count}})
            @{test='dev-infrastructure-preview';environment=$Environment;source='ARM';resources=$operations.Count;changes=$counts;scopeVerified=$true;
              diagnostics=$diagnostics.Count;diagnosticCategories=$diagnosticCategories;missingResourceTypes=$missingTypes;missingExpectedResources=$missingExpected;
              passed=($blocked.Count -eq 0 -and $diagnostics.Count -eq 0 -and $missingTypes.Count -eq 0 -and $missingExpected -eq 0);rawOutputSuppressed=$true}
          }
