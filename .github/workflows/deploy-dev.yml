              $containers.Count -ne 1 -or [string]::IsNullOrWhiteSpace($containers[0].image) -or
              $Deployment.properties.provisioningState -cne 'Succeeded' -or $parameters -isnot [Collections.IDictionary] -or
              -not $parameters.Contains('easyAuthClientId') -or -not $parameters.Contains('easyAuthSecretKeyVaultUri') -or
              -not $parameters.Contains('registerImage') -or $parameters.registerImage.value -cne $containers[0].image -or
              $AuthConfigs.value -isnot [array]){throw 'Live register configuration is required for JWT preview.'}
            $clientId=$parameters.easyAuthClientId.value
            $secretUri=$parameters.easyAuthSecretKeyVaultUri.value
            if($clientId -isnot [string] -or $secretUri -isnot [string]){throw 'Live register configuration is required for JWT preview.'}
            if($clientId -ceq ''){
              if($secretUri -cne '' -or $AuthConfigs.value.Count -ne 0){throw 'Live register configuration is required for JWT preview.'}
            }else{
              $auth=@($AuthConfigs.value|Where-Object name -CEQ 'current')
              if($clientId -cnotmatch '\A[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\z' -or $secretUri -cnotmatch '\Ahttps://[^/?#@]+/secrets/[A-Za-z0-9-]+(?:/[A-Za-z0-9]+)?\z' -or
                $AuthConfigs.value.Count -ne 1 -or $auth.Count -ne 1 -or $auth[0].properties.platform.enabled -ne $true -or
                $auth[0].properties.identityProviders.azureActiveDirectory.enabled -ne $true -or
                $auth[0].properties.identityProviders.azureActiveDirectory.registration.clientId -cne $clientId -or
                $auth[0].properties.identityProviders.azureActiveDirectory.registration.clientSecretSettingName -cne 'easyauth-client-secret'){
                throw 'Live register configuration is required for JWT preview.'
