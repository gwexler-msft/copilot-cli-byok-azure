          function ConvertFrom-DevPreviewAuthResponse {
            param([int]$StatusCode,[string]$Output)
            $payload=ConvertFrom-Json -InputObject $Output -AsHashtable
            if($payload -isnot [Collections.IDictionary]){throw 'Live register configuration is required for JWT preview.'}
            $errorCode=$payload.error.code ?? $payload.code
            if($StatusCode -eq 404 -and $errorCode -ceq 'AuthConfigNotFound'){return @{value=@()}}
            if($StatusCode -ne 200 -or $payload.error -or $payload.code -or $payload.value -isnot [array]){
              throw 'Live register configuration is required for JWT preview.'
            }
            $payload
          }
          function Get-DevPreviewRegisterConfig {
            param($Application,$AuthConfigs,$Deployment)
