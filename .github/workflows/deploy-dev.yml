              'jwt-tokens-per-minute'=[string]$Parameters.jwtDefaultTokensPerMinute.value;'jwt-monthly-call-quota'=[string]$Parameters.jwtDefaultMonthlyCallQuota.value}
            foreach($name in $required.Keys){
              $setting=@($NamedValues.value|Where-Object name -CEQ $name)
              if($setting.Count -ne 1 -or $setting[0].properties.secret -ne $false -or $setting[0].properties.value -cne $required[$name]){throw 'Live APIM trust or routing differs from the candidate.'}
            }
            $pinned=@($NamedValues.value|Where-Object name -CEQ 'aoai-pinned-models')
            $nativeProducts=@($Products.value|Where-Object name -cin @('byok-standard','byok-power'))
            $otherProducts=@($Products.value|Where-Object name -cnotin @('byok-standard','byok-power'))
            $callerSettings=@($NamedValues.value|Where-Object name -like 'caller-*')
            $callerFragments=@($Fragments.value|Where-Object {$_.name -cin @('byok-authenticate','byok-strip-caller-credentials','byok-apply-caller-limits','byok-response-owner-context','byok-prepare-responses-request','byok-read-response-owner','byok-verify-response-owner','byok-locate-response-owner')})
            if($pinned.Count -ne 1 -or -not [string]::IsNullOrWhiteSpace($pinned[0].properties.value) -or
              $nativeProducts.Count -ne 2 -or @($nativeProducts.name|Sort-Object -Unique).Count -ne 2 -or
              @($nativeProducts|Where-Object {$_.properties.subscriptionRequired -ne $true}).Count -or
              $otherProducts.Count -gt 1 -or @($otherProducts|Where-Object {$_.name -cne $trust.jwtProductId -or $_.properties.subscriptionRequired -ne $false}).Count -or
              (-not $AllowPrepared -and ($callerSettings.Count -or $callerFragments.Count -or $otherProducts.Count))){throw 'Gateway is not the verified native-key-only baseline.'}
            if($AllowPrepared){
              $expectedSettings=@(Get-DevApimPreviewPaths $trust.jwtProductId|Where-Object {$_ -clike 'namedValues/*'}|ForEach-Object {$_.Substring(12)})
              if(@($callerSettings|Where-Object name -cnotin $expectedSettings).Count -or
                @($callerSettings.name|Sort-Object -Unique).Count -ne $callerSettings.Count){throw 'Unrecognized prepared caller resources.'}
            }
            $operationPaths=@{'chat-completions'='POST /v1/chat/completions';'completions'='POST /v1/completions';'embeddings'='POST /v1/embeddings';
              'responses'='POST /v1/responses';'responses-get'='GET /v1/responses/{response_id}';'responses-delete'='DELETE /v1/responses/{response_id}';
              'responses-cancel'='POST /v1/responses/{response_id}/cancel';'responses-input-items'='GET /v1/responses/{response_id}/input_items';
              'chat-completions-deployment'='POST /deployments/{deployment}/chat/completions';'completions-deployment'='POST /deployments/{deployment}/completions';
