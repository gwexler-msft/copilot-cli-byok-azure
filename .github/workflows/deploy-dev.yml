          function Test-DevRecoveryTemplate {
            param($Deployed,$Candidate)
            function ConvertTo-RecoveryComparableTemplate {
              param($Value,[string]$Path='template')
              if($Value -is [Collections.IDictionary]){
                $normalized=[ordered]@{}
                $isTemplate=$Value.Contains('$schema') -and $Value.Contains('resources') -and $Value.Contains('contentVersion')
                $isDeclaration=$Path -match '\.(?:parameters|outputs|definitions)\.[^.]+\z'
                foreach($key in @($Value.Keys|Sort-Object -CaseSensitive)){
                  if($key -ceq 'metadata' -and ($isTemplate -or $isDeclaration)){continue}
                  $entry=$Value[$key]
                  if($key -ceq 'type' -and ($isDeclaration -or $Path -match '\.definitions\.') -and
                    $entry -is [string] -and $entry -iin @('string','securestring','int','bool','object','secureobject','array')){
                    $entry=$entry.ToLowerInvariant()
                  }
                  $normalized[$key]=ConvertTo-RecoveryComparableTemplate $entry ($Path+'.'+$key)
                }
                return $normalized
              }
              if($Value -is [array]){return ,@($Value|ForEach-Object {ConvertTo-RecoveryComparableTemplate $_ ($Path+'[]')})}
              if($Value -is [string]){return $Value.Replace("`r`n","`n")}
              $Value
            }
            $before=ConvertTo-RecoveryComparableTemplate $Deployed
            $after=ConvertTo-RecoveryComparableTemplate $Candidate
            [Newtonsoft.Json.Linq.JToken]::DeepEquals(
              [Newtonsoft.Json.Linq.JToken]::Parse(($before|ConvertTo-Json -Depth 100 -Compress)),
              [Newtonsoft.Json.Linq.JToken]::Parse(($after|ConvertTo-Json -Depth 100 -Compress)))
          }
          function Get-DevRecoveryRegisterConfig {
            param($Application,$AuthConfigs,$NestedDeployment,$Parent,$ParentOperations,[string]$GroupId,[bool]$TemplateMatches)
            $settings=$Parent.properties.parameters
            $timestamp=[DateTimeOffset]$Parent.properties.timestamp
            $failed=@($ParentOperations|Where-Object {$_.properties.provisioningState -cne 'Succeeded' -and $_.properties.provisioningOperation -cne 'EvaluateDeploymentOutput'})
            if($Parent.properties.provisioningState -cne 'Failed' -or -not $TemplateMatches -or
              $timestamp -lt [DateTimeOffset]::UtcNow.AddHours(-24) -or $timestamp -gt [DateTimeOffset]::UtcNow -or
              $settings.envName.value -cne 'comm-dev' -or $settings.namePrefix.value -cne 'copilot-byok' -or
              $settings.cloudEnv.value -cne 'AzureCloud' -or $settings.callerAuthRollout.value -cne 'legacy' -or
              $settings.callerAuthPreparation.value.enabled -ne $false -or $failed.Count -ne 1 -or
              $failed[0].properties.targetResource.id -ine ($GroupId+'/providers/Microsoft.Resources/deployments/apim') -or
              -not $Application.id.StartsWith($GroupId+'/providers/Microsoft.App/containerApps/',[StringComparison]::OrdinalIgnoreCase) -or
              $NestedDeployment.properties.provisioningState -cne 'Succeeded' -or
              $NestedDeployment.properties.parameters.easyAuthClientId.value -cne $settings.registerEasyAuthClientId.value -or
              $NestedDeployment.properties.parameters.easyAuthSecretKeyVaultUri.value -cne $settings.registerEasyAuthSecretKeyVaultUri.value){throw 'Recovery baseline cannot be verified.'}
            $copy=$NestedDeployment|ConvertTo-Json -Depth 100|ConvertFrom-Json -AsHashtable
            $copy.properties.parameters.registerImage=@{value=$settings.registerAppImage.value}
            Get-DevPreviewRegisterConfig $Application $AuthConfigs $copy
          }
          function New-DevPreviewCandidate {
            param($Document,[bool]$PreviewOnly,[bool]$PreviewJwt,[string]$PreviousKeyState)
            if(-not $PreviewJwt){return $Document}
            if(-not $PreviewOnly){throw 'JWT preview requires preview-only dispatch.'}
            $candidate=$Document|ConvertTo-Json -Depth 100|ConvertFrom-Json -AsHashtable
            $trust=$candidate.parameters.callerAuthPreparation.value
            if($trust -isnot [Collections.IDictionary] -or $trust.enabled -ne $false -or $trust.keyEnabled -ne $true -or
              $trust.entraEnabled -ne $true -or $trust.oktaTrust.enabled -ne $false -or
              $candidate.parameters.callerAuthRollout.value -cne 'legacy' -or [string]::IsNullOrWhiteSpace($PreviousKeyState) -or
              $candidate.parameters.Contains('responseOwnerKey') -or $candidate.parameters.Contains('responseOwnerPreviousKey')){throw 'Invalid disabled candidate preparation.'}
            $trust.enabled=$true
            $candidate.parameters.callerAuthRollout.value='coexistence'
            $candidate.parameters.responseOwnerKey=@{value='${BYOK_RESPONSE_OWNER_KEY}'}
            $candidate.parameters.responseOwnerPreviousKey=@{value=$(if($PreviousKeyState -ceq '__none__'){''}else{'${BYOK_RESPONSE_OWNER_PREVIOUS_KEY}'})}
            $candidate
          }
          function Resolve-DevPreviewParameters {
            param($Document,$Template,[string]$Environment,[string]$Location,[ValidateSet('legacy','shared','coexistence')][string]$CallerRollout='legacy',[bool]$AllowPilotCaller=$false)
            if($Environment -cnotin @('comm-dev','gov-dev','comm-pilot','gov-pilot') -or $Document.parameters -isnot [Collections.IDictionary] -or
              ($Environment -clike '*-pilot' -and (-not $AllowPilotCaller -or $CallerRollout -ceq 'legacy'))){throw 'Invalid preview parameters.'}
            $parameters=[ordered]@{}
            foreach($name in $Document.parameters.Keys){
              $parameter=$Document.parameters[$name]
              if($parameter -isnot [Collections.IDictionary] -or $parameter.Count -ne 1 -or -not $parameter.Contains('value') -or -not $Template.parameters.Contains($name)){throw 'Invalid preview parameters.'}
              $value=$parameter.value
              if($value -is [string] -and $value -cmatch '\A\$\{([A-Z_][A-Z0-9_]*)\}\z'){
                $value=[Environment]::GetEnvironmentVariable($Matches[1])
                if($null -eq $value){continue}
                $definition=$Template.parameters[$name]
                if($definition.type -inotmatch '\A(?:secure)?string\z'){throw 'Unsupported preview substitution.'}
                if($value -ceq '' -and $definition.defaultValue -ceq ''){continue}
              }elseif(($value|ConvertTo-Json -Depth 100 -Compress) -match '\$\{'){
                throw 'Unsupported preview substitution.'
              }
              $parameters[$name]=@{value=$value}
            }
            Assert-DevCallerTieringParameters $parameters
            $expectedCloud=if($Environment.StartsWith('gov-',[StringComparison]::Ordinal)){'AzureUSGovernment'}else{'AzureCloud'}
            $expectedLocation=if($Environment.StartsWith('gov-',[StringComparison]::Ordinal)){'usgovvirginia'}else{'eastus2'}
            if($parameters.envName.value -cne $Environment -or $parameters.namePrefix.value -cne 'copilot-byok' -or
              $parameters.cloudEnv.value -cne $expectedCloud -or $parameters.location.value -cne $expectedLocation -or $Location -cne $expectedLocation -or
              $parameters.authMode.value -cne 'subscriptionKey'){throw 'Invalid preview context.'}
            if($CallerRollout -ceq 'legacy' -and (($parameters.Contains('callerAuthRollout') -and $parameters.callerAuthRollout.value -cne 'legacy') -or
              ($parameters.Contains('callerAuthPreparation') -and $parameters.callerAuthPreparation.value.enabled) -or
              $parameters.Contains('responseOwnerKey') -or $parameters.Contains('responseOwnerPreviousKey'))){throw 'Preview is not the approved legacy baseline.'}
            if($CallerRollout -cin @('shared','coexistence')){
              $trust=$parameters.callerAuthPreparation.value
              $key=$parameters.responseOwnerKey.value
              $previous=$parameters.responseOwnerPreviousKey.value
              $keyPattern='\A[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=\z'
              if($parameters.callerAuthRollout.value -cne $CallerRollout -or $trust.enabled -ne $true -or $trust.keyEnabled -ne $true -or
                $trust.entraEnabled -ne $true -or $trust.oktaTrust.enabled -ne $false -or $key -isnot [string] -or $key -cnotmatch $keyPattern -or $key -ceq ('A'*43+'=') -or
                $previous -isnot [string] -or ($previous -cne '' -and ($previous -cnotmatch $keyPattern -or $previous -ceq ('A'*43+'=') -or $previous -ceq $key))){throw 'Invalid coexistence preview parameters.'}
            }
            @{parameters=$parameters}
          }
          function Invoke-DevPreviewProcess {
            param([string]$FileName,[string[]]$Arguments,[string]$InputJson='')
            $executable=Get-Command $FileName -CommandType Application|Select-Object -First 1
            $start=[Diagnostics.ProcessStartInfo]::new($executable.Source)
            $start.UseShellExecute=$false
            $start.RedirectStandardOutput=$true
            $start.RedirectStandardError=$true
            $start.RedirectStandardInput=$true
            $start.StandardInputEncoding=[Text.UTF8Encoding]::new($false)
            $start.StandardOutputEncoding=[Text.UTF8Encoding]::new($false)
            $start.StandardErrorEncoding=[Text.UTF8Encoding]::new($false)
            foreach($argument in $Arguments){$start.ArgumentList.Add($argument)}
            $process=[Diagnostics.Process]::Start($start)
            try{
              $stdout=$process.StandardOutput.ReadToEndAsync()
              $stderr=$process.StandardError.ReadToEndAsync()
              if($InputJson){$process.StandardInput.Write($InputJson)}
              $process.StandardInput.Close()
              $process.WaitForExit()
              $output=$stdout.GetAwaiter().GetResult()
              $failure=$stderr.GetAwaiter().GetResult()
              if($process.ExitCode -ne 0){
                $categories=@([regex]::Matches($failure,'AuthorizationFailed|InvalidTemplate|InvalidTemplateDeployment|RequestDisallowedByPolicy|InvalidParameter|SubscriptionNotFound|SkuNotAvailable|QuotaExceeded')|ForEach-Object Value|Select-Object -Unique)
                @{test='dev-infrastructure-preview-command';passed=$false;categories=$categories;rawOutputSuppressed=$true}|ConvertTo-Json -Compress|Write-Host
                throw 'Preview command failed.'
              }
              $output
            }finally{$output=$null;$failure=$null;$process.Dispose()}
          }
